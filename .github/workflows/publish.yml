# Publish to npm with Trusted Publishing (OIDC) — no token, no OTP.
#
# npm is restricting the token-based 2FA bypass that automation tokens relied on
# (https://gh.io/npm-gat-bypass2fa-deprecation), which makes publishing from a
# laptop impossible on an account whose only second factor is a passkey: there is
# no code to type. This is npm's own replacement. GitHub mints a short-lived OIDC
# identity for the run, npm verifies it against the trusted publisher configured
# on the package, and nothing secret is stored anywhere or expires.
#
# ONE-TIME SETUP on npmjs.com, before this can work:
#   package page -> Settings -> Trusted Publisher -> GitHub Actions
#     Organization or user: Delusional1
#     Repository:           bank-formats
#     Workflow filename:    publish.yml
#     Environment:          (leave blank)
#
# To release after that: bump the version in package.json, commit, then either
# push a tag  ->  git tag v0.3.0 && git push origin v0.3.0
# or run this workflow by hand from the Actions tab.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required — this is what lets npm verify the run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm; the one bundled with Node may
      # predate OIDC support.
      - run: npm install -g npm@latest

      # Never publish something that does not pass. The package has no
      # dependencies, so there is nothing to install first.
      - run: npm test

      # Refuse to publish a version that is already on the registry, rather than
      # failing halfway through with a confusing 403.
      - name: Check this version is new
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          echo "About to publish $NAME@$VER"
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VER is already published. Bump the version in package.json."
            exit 1
          fi

      - run: npm publish --provenance --access public
